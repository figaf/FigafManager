name: Publish user manual

on:
  push:
    branches: [master]
    paths:
      - docs/figaf-manager-manual.html
      - docs/manual-images/**
      - .github/workflows/manual-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p site/manual-images
          cp docs/figaf-manager-manual.html site/index.html
          cp docs/manual-images/*.png site/manual-images/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
